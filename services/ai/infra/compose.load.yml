name: topos-ai-loadtest

include:
  - path: ../../../infrastructure/docker/ai-qdrant/qdrant.yml
  - path: ../../../infrastructure/docker/ai-embeddings/embedding.yml

x-ai-service-env: &ai-service-env
  PORT: 50051
  LLM_MODE: ${LLM_MODE:-fake}
  LLM_API_KEY: ${LLM_API_KEY:-}
  EMBEDDING_MODE: ${EMBEDDING_MODE:-fake}
  EMBEDDING_URL: http://embedding-service:11434
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-snowflake-arctic-embed2:568m}
  VECTOR_MODE: ${VECTOR_MODE:-qdrant}
  QDRANT_URL: http://qdrant:6333
  # deterministic | agent | fake; fake scripts the blend decision so
  # agent-path load runs never touch an LLM.
  AGENT_MODE: ${AGENT_MODE:-deterministic}
  LOG_LEVEL: ${LOG_LEVEL:-WARNING}
  METRICS_PORT: 12666

services:
  # Included qdrant always runs (fake store runs still start it, unused).
  # Shrink its footprint for load runs; main stack defaults to 1G.
  qdrant:
    deploy:
      resources:
        limits:
          memory: ${QDRANT_MEM:-256M}
        reservations:
          memory: 64M

  # Only started for embedding-real runs (EMBEDDING_MODE=ollama); fake
  # runs never pull the model. Profiles merge with the included
  # definitions so the shared service stays always-on in infra/compose.yml.
  embedding-service:
    profiles:
      - embedding-real
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEM:-2G}
        reservations:
          memory: 512M

  embedding-model-init:
    profiles:
      - embedding-real

  ai-service:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *ai-service-env
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/healthcheck.py"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    volumes:
      - ../load-tests/healthcheck.py:/healthcheck.py:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: ${SVC_MEM:-512M}
        reservations:
          memory: 128M

  k6:
    image: grafana/k6:latest
    restart: "no"
    command: ["run", "--summary-trend-stats=avg,med,p(90),p(95),p(99),max", "/load-tests/k6/${SCRIPT:-mixed}.js"]
    environment:
      TARGET: ai-service:50051
      VUS: ${VUS:-20}
      DURATION: ${DURATION:-30s}
      RPS: ${RPS:-100}
      WEIGHTS: ${WEIGHTS:-summary:40,tags:30,post:30}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-fake}
      SEARCH_P95: ${SEARCH_P95:-250}
      SEARCH_P99: ${SEARCH_P99:-600}
      RECOMMEND_P95: ${RECOMMEND_P95:-250}
      RECOMMEND_P99: ${RECOMMEND_P99:-600}
      SURPRISE_P95: ${SURPRISE_P95:-250}
      SURPRISE_P99: ${SURPRISE_P99:-600}
      FRESH_P95: ${FRESH_P95:-250}
      FRESH_P99: ${FRESH_P99:-600}
      EXPLORER_P95: ${EXPLORER_P95:-250}
      EXPLORER_P99: ${EXPLORER_P99:-600}
      CHAT_P95: ${CHAT_P95:-500}
      CHAT_P99: ${CHAT_P99:-1500}
    depends_on:
      ai-service:
        condition: service_healthy
    volumes:
      - ../load-tests/k6:/load-tests/k6:ro
      - ../proto:/proto:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: ${K6_MEM:-384M}
        reservations:
          memory: 64M

networks:
  app-network:
    name: ai-loadtest-net
    driver: bridge
