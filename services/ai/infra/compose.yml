x-ai-service-env: &ai-service-env
  PORT: ${AI_SERVICE_INT_PORT:-50051}
  METRICS_PORT: ${AI_METRICS_INT_PORT:-12666}
  ENV_TYPE: ${ENV_TYPE:-dev}
  AWS_REGION: ${AWS_REGION:-ap-south-1}
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://host.docker.internal:4566}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  AI_SECRETS_NAME: ${AI_SECRETS_NAME:-topos/ai/secrets}
  AI_CONFIG_PARAM: ${AI_CONFIG_PARAM:-/topos/ai/config}
  LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
  LLM_API_URL: ${AI_LLM_API_URL:-https://lightning.ai/api/v1/chat/completions}
  LLM_API_KEY: ${LIGHTNING_AI_API_KEY:-}
  LLM_MODEL: ${AI_LIGHTNING_MODEL:-lightning-ai/gpt-oss-20b}
  LLM_MODE: ${AI_LLM_MODE:-fake}
  LLM_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
  CONTENT_SERVICE_URL: ${AI_CONTENT_SERVICE_URL:-http://content-service:4002}
  CONTENT_INTERNAL_TOKEN: ${CONTENT_INTERNAL_TOKEN:-}
  LANGCHAIN_TRACING: ${AI_LANGCHAIN_TRACING:-false}
  LANGCHAIN_API_KEY: ${AI_LANGCHAIN_API_KEY:-}
  LANGCHAIN_PROJECT: ${AI_LANGCHAIN_PROJECT:-topos-ai}
  CHECKPOINT_DB_URL: ${AI_CHECKPOINT_DB_URL:-postgresql://${AI_POSTGRES_USER:-ai_checkpointer}:${AI_POSTGRES_PASSWORD:-ai_checkpointer_pass}@user-postgres:5432/${AI_POSTGRES_DB:-ai_checkpoints}}
  CHECKPOINT_DB_URL_MIGRATE: ${AI_CHECKPOINT_DB_URL_MIGRATE:-${AI_CHECKPOINT_DB_URL:-postgresql://${AI_POSTGRES_USER:-ai_checkpointer}:${AI_POSTGRES_PASSWORD:-ai_checkpointer_pass}@user-postgres:5432/${AI_POSTGRES_DB:-ai_checkpoints}}}
  CHECKPOINT_POOL_MIN_SIZE: ${AI_CHECKPOINT_POOL_MIN_SIZE:-1}
  CHECKPOINT_POOL_MAX_SIZE: ${AI_CHECKPOINT_POOL_MAX_SIZE:-10}
  QDRANT_URL: ${AI_QDRANT_URL:-http://qdrant:6333}
  QDRANT_API_KEY: ${AI_QDRANT_API_KEY:-}
  QDRANT_VECTOR_SIZE: ${AI_QDRANT_VECTOR_SIZE:-1024}
  SEARCH_DENSE_SCORE_THRESHOLD: ${AI_SEARCH_DENSE_SCORE_THRESHOLD:-0.3}
  EMBEDDING_MODE: ${AI_EMBEDDING_MODE:-ollama}
  EMBEDDING_URL: ${AI_EMBEDDING_URL:-http://embedding-service:11434}
  EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-snowflake-arctic-embed2:568m}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${AI_OTLP_ENDPOINT:-}

include:
  - path: ../../../infrastructure/docker/ai-qdrant/qdrant.yml
  - path: ../../../infrastructure/docker/ai-embeddings/embedding.yml
  - path: ../../../infrastructure/docker/users-postgres/postgres.yml

services:
  # Shared instance (see infrastructure/docker/users-postgres): remap the
  # host port so the ai and user stacks can run side by side.
  user-postgres:
    ports:
      - "${AI_POSTGRES_EXT_PORT:-5433}:5432"

  ai-service:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_EXT_PORT:-50051}:${AI_SERVICE_INT_PORT:-50051}"
      - "${AI_METRICS_EXT_PORT:-12666}:${AI_METRICS_INT_PORT:-12666}"
    environment: *ai-service-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
      embedding-model-init:
        condition: service_completed_successfully
      user-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import grpc, os, sys
          from grpc_health.v1 import health_pb2, health_pb2_grpc
          channel = grpc.insecure_channel(f"127.0.0.1:{os.environ['PORT']}")
          status = health_pb2_grpc.HealthStub(channel).Check(
              health_pb2.HealthCheckRequest(service="ai.AIService"), timeout=5
          ).status
          sys.exit(0 if status == health_pb2.HealthCheckResponse.SERVING else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network

networks:
  app-network:
    name: ${APP_NETWORK:-topos_local_network}
