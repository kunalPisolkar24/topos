services:
  embedding-service:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "${EMBEDDING_EXT_PORT:-11434}:${EMBEDDING_INT_PORT:-11434}"
    volumes:
      - embedding_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: ${EMBEDDING_MEM:-4G}
        reservations:
          memory: 2G

  # One-shot init: downloads the embedding model into the shared volume
  # so the embedding service starts with the model already available.
  # OLLAMA_HOST must point at the server container: the CLI defaults to
  # 127.0.0.1, which is empty inside this one-shot container.
  embedding-model-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      embedding-service:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command: "ollama pull ${EMBEDDING_MODEL:-snowflake-arctic-embed2:568m}"
    environment:
      - OLLAMA_HOST=embedding-service:11434
    volumes:
      - embedding_data:/root/.ollama
    networks:
      - app-network

volumes:
  embedding_data:
