services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "${QDRANT_EXT_PORT:-6333}:${QDRANT_INT_PORT:-6333}"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # TCP-only checks pass while Qdrant is still loading collections;
      # hit /healthz so dependents gate on actual readiness.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/${QDRANT_INT_PORT:-6333} && printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -qm1 200 <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: ${QDRANT_MEM:-1G}
        reservations:
          memory: 512M

volumes:
  qdrant_data:
