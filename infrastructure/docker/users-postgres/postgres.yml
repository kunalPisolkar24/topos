services:
  user-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${USER_POSTGRES_EXT_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=topos_user
      - POSTGRES_PASSWORD=topos_pass
      - POSTGRES_DB=topos_users
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topos_user -d topos_users"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: ${USER_POSTGRES_MEM:-512M}
        reservations:
          memory: 256M

volumes:
  user_postgres_data:
