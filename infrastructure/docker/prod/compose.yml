# Topos prod stack: app containers only, no docker postgres/redis/mongo/kafka/qdrant.
# Data plane comes from Floci (RDS :7001, Valkey :6379, DocDB/MSK sidecars) and
# Qdrant Cloud; control plane from SM/SSM via ENV_TYPE=prod. Env file: .env (copy from .env.example).
# Driven from the repo root: SEED_SECRETS=1 make prod-up (seed SM/SSM first), make prod-up (default, no seed).

name: topos-prod

include:
  - path: ../../../services/user/infra/compose.prod.yml
  - path: ../../../services/content/infra/compose.prod.yml
  - path: ../../../services/ai/infra/compose.prod.yml

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.122.1
    container_name: ${OTEL_COLLECTOR_CONTAINER:-prod-otel-collector}
    restart: unless-stopped
    # No healthcheck: the image is scratch-based with no shell, so
    # CMD-SHELL probes cannot run. Dependents use service_started.
    # Root is required to traverse /var/lib/docker (0700) for the filelog
    # receiver; the collector only reads container logs, config stays ro.
    user: "0:0"
    # Local driver keeps the collector's own text logs out of the filelog
    # receiver (it only tails json-file): otherwise each parser failure on
    # its own stack traces logs another line and feedback-loops. docker logs
    # still works for debugging the collector itself.
    logging:
      driver: local
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      # Host docker logs for the filelog receiver. Requires the default
      # json-file logging driver and /var/lib/docker on the prod host —
      # verify with: docker info --format '{{.DockerRootDir}} {{.LoggingDriver}}'
      - /var/lib/docker/containers:/var/log/docker:ro
    environment:
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-}
      - NEW_RELIC_OTLP_ENDPOINT=${NEW_RELIC_OTLP_ENDPOINT:-https://otlp.nr-data.net:4317}
      - NEW_RELIC_OTLP_HTTP_ENDPOINT=${NEW_RELIC_OTLP_HTTP_ENDPOINT:-https://otlp.nr-data.net}
    expose:
      - "4317"
      - "4318"
      - "13133"
    networks:
      - floci-bridge

  gateway:
    build:
      context: ../../../
      dockerfile: gateway/Dockerfile
    container_name: ${GATEWAY_CONTAINER:-prod-gateway}
    restart: unless-stopped
    ports:
      - "${GATEWAY_EXT_PORT:-4000}:${GATEWAY_INT_PORT:-4000}"
    environment:
      - FRONTEND_PUBLIC_ORIGIN=${FRONTEND_PUBLIC_ORIGIN:-${VITE_BACKEND_URL:-}}
      - OTEL_TRACING_ENDPOINT=${OTEL_TRACING_ENDPOINT:-http://otel-collector:4317}
      - OTEL_SERVICE_NAME=gateway
    # The router image ships no curl/wget, so probe the health listener
    # with bash's /dev/tcp instead (same as gateway/compose.local.yml).
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8088 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -qm1 200 <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      user-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - floci-bridge

  frontend:
    build:
      context: ../../../
      dockerfile: frontend/Dockerfile
      args:
        VITE_ENV_TYPE: ${VITE_ENV_TYPE:-prod}
        VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL:-http://localhost:4000/graphql}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:4000}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET:-}
        VITE_ENABLE_MOCKS: ${VITE_ENABLE_MOCKS:-false}
    container_name: ${FRONTEND_CONTAINER:-prod-frontend}
    restart: unless-stopped
    ports:
      - "${FRONTEND_EXT_PORT:-3000}:${FRONTEND_INT_PORT:-3000}"
    environment:
      PORT: ${FRONTEND_INT_PORT:-3000}
      VITE_ENV_TYPE: ${VITE_ENV_TYPE:-prod}
      VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL:-http://localhost:4000/graphql}
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:4000}
      VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-}
      VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET:-}
      VITE_ENABLE_MOCKS: ${VITE_ENABLE_MOCKS:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${FRONTEND_INT_PORT:-3000}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - floci-bridge

networks:
  floci-bridge:
    name: floci-apps
    external: true
